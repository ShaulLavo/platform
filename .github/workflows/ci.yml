name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned from `packageManager` in package.json so CI and the pre-commit
      # hook cannot disagree about which Bun compiled the code.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The node-pty bridge spawns the real Node binary, never Bun's `node`
      # shim, so the terminal tests need a genuine Node on PATH.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Bun and Turbo
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Runs the scripts suite plus every workspace's own. `apps/web`'s `test`
      # is scoped to `--project node --project dom`; the browser project is a
      # separate job below because its runner is unreliable.
      - name: Test
        run: bun run test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Known unreliable: the Vitest browser runner hangs at the RUN banner
    # locally even for a trivial test, so the two `*.browser.tsx` files are
    # currently verified by nobody. This job exists to find out whether the
    # hang is a local-environment problem or a real one — it must not be able
    # to block a merge until that is answered, hence `continue-on-error`.
    # Remove that line (and this comment) the first time it goes green.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      - name: Browser test
        run: bun run --cwd apps/web test:browser
