<!doctype html>
<html lang="en">
  <head>
    <!-- <script
      src="https://unpkg.com/react-scan/dist/auto.global.js"
      crossorigin="anonymous"
    ></script> -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-monorepo</title>
    <style>
      /* Boot floor: painted before any module loads, so the module waterfall
         shows the theme's background instead of UA white. Declared as the
         first (lowest-priority) layer so the token rules in
         packages/ui/src/styles/globals.css win the moment they load —
         including the transparent floor a see-through shell window needs. The
         colors mirror --background-solid there; changing them means changing
         both.

         The default `graphite` palette is inline and `sage` arrives as
         --boot-floor from the script below, rather than both being attribute
         selectors: a [data-palette] rule would outrank
         html[data-backdrop='transparent'] and paint an opaque floor over the
         compositor's real blur. */
      @layer boot {
        html {
          color-scheme: light;
          background-color: var(--boot-floor, oklch(1 0.006 70));
        }
        html.dark {
          color-scheme: dark;
          background-color: var(--boot-floor, oklch(0.145 0.006 70));
        }
        html[data-backdrop='transparent'] {
          background-color: transparent;
        }
      }
    </style>
    <script>
      // Pre-paint theme class and palette for the boot floor above. Reads the
      // settings boot mirror (written by features/settings/utils/boot-mirror.ts,
      // which this classic script cannot import — a module script would defer
      // past first paint). applyAppearance in main.tsx re-applies the full
      // appearance once the app boots; this only decides dark vs light,
      // palette, and density.
      ;(() => {
        let theme = 'system'
        let palette = 'graphite'
        let density = 'compact'
        try {
          const raw = localStorage.getItem('platform.settings-boot-mirror.v1')
          const mirror = raw ? JSON.parse(raw) : {}
          const storedTheme = mirror['workbench.colorTheme']
          const storedDensity = mirror['workbench.density']
          if (storedTheme === 'dark' || storedTheme === 'light') theme = storedTheme
          if (mirror['workbench.palette'] === 'sage') palette = 'sage'
          if (storedDensity === 'compact' || storedDensity === 'cozy') density = storedDensity
        } catch {
          // An unreadable mirror costs a system-theme boot floor, nothing more.
        }
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const root = document.documentElement
        root.classList.add(dark ? 'dark' : 'light')
        // Set before globals.css loads, so the first frame it paints already
        // matches the palette instead of flashing the default one.
        root.setAttribute('data-palette', palette)
        root.setAttribute('data-density', density)
        if (palette !== 'sage') return

        root.style.setProperty(
          '--boot-floor',
          dark ? 'oklch(0.17 0.01 260)' : 'oklch(0.98 0.003 90)',
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
